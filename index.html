<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kartei App</title>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: #eef2f7; color: #333; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { max-width: 700px; width: 100%; }
        
        /* Header */
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .logo { display: flex; align-items: center; gap: 10px; font-size: 24px; font-weight: bold; color: #2c3e50; }
        .icon-box { background: #fff; padding: 8px 12px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); cursor: pointer; }
        
        /* Benachrichtigungs-Banner */
        .banner { background: white; border: 1px solid #dcdde1; padding: 15px 20px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.03); }
        .banner button { padding: 8px 16px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; }
        .btn-view { background: #5c6bc0; color: white; }
        .btn-dismiss { background: #f1f2f6; color: #57606f; }

        /* Ordner Karten */
        .card-item { background: white; border-radius: 12px; padding: 18px 20px; margin-bottom: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); display: flex; justify-content: space-between; align-items: center; cursor: pointer; border-left: 6px solid #5c6bc0; transition: transform 0.1s; }
        .card-item:hover { transform: translateY(-2px); }
        .card-info h3 { margin: 0 0 5px 0; font-size: 18px; color: #2f3640; }
        .card-info p { margin: 0; font-size: 13px; color: #718093; }
        
        /* Fortschrittsbalken */
        .progress-bar { width: 100%; height: 6px; background: #dfe4ea; border-radius: 3px; margin-top: 10px; overflow: hidden; display: flex; }
        .progress-green { background: #2ed573; height: 100%; }
        .progress-yellow { background: #ffa502; height: 100%; }
        .progress-red { background: #ff4757; height: 100%; }

        /* Buttons & Badges */
        .badge-letter { width: 36px; height: 36px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: bold; color: white; font-size: 16px; margin-right: 15px; flex-shrink: 0; }
        .card-left { display: flex; align-items: center; flex: 1; }
        .btn-icon { background: none; border: none; cursor: pointer; color: #a4b0be; font-size: 16px; }
        .btn-icon:hover { color: #ff4757; }

        /* Modal / Popups */
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); display: flex; justify-content: center; align-items: center; z-index: 100; }
        .modal-content { background: white; padding: 25px; border-radius: 14px; width: 90%; max-width: 500px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        .modal-content textarea { width: 100%; height: 100px; padding: 10px; border: 1px solid #dcdde1; border-radius: 8px; margin-top: 10px; font-family: monospace; font-size: 12px; }
        .modal-content input { width: 100%; padding: 10px; border: 1px solid #dcdde1; border-radius: 8px; margin-bottom: 12px; }
        
        .primary-btn { background: #5c6bc0; color: white; border: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 10px; }
        .hidden { display: none !important; }
        
        /* Lern-Modus */
        .learn-card { background: white; border-radius: 16px; padding: 40px; text-align: center; font-size: 24px; font-weight: bold; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 20px; min-height: 200px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .stats-row { display: flex; gap: 8px; margin-bottom: 15px; flex-wrap: wrap; }
        .stat-badge { padding: 6px 12px; border-radius: 20px; font-size: 13px; font-weight: bold; color: white; }
        .bg-green { background: #2ed573; }
        .bg-yellow { background: #ffa502; }
        .bg-red { background: #ff4757; }
        .bg-gray { background: #747d8c; }
    </style>
</head>
<body>

<div class="container" id="app">
    <!-- Wird dynamisch per JavaScript geladen -->
</div>

<!-- Modal für Backup -->
<div id="backup-modal" class="modal hidden">
    <div class="modal-content">
        <h3>Sicherung und Übertragung</h3>
        <p style="font-size: 13px; color: #666;">Kopiere den Text, um deine Karten zu sichern oder auf einem anderen Gerät zu nutzen.</p>
        <textarea id="backup-text" readonly></textarea>
        <button class="primary-btn" onclick="copyBackup()">Text kopieren</button>
        <hr style="margin: 15px 0; border: none; border-top: 1px solid #eee;">
        <p style="font-size: 13px; color: #666;">Sicherungstext einfügen, um Daten wiederherzustellen:</p>
        <input type="text" id="restore-input" placeholder="Hier einfügen...">
        <button class="primary-btn" style="background:#2ed573;" onclick="restoreData()">Wiederherstellen</button>
        <button class="primary-btn" style="background:#f1f2f6; color:#333;" onclick="toggleBackup(false)">Schließen</button>
    </div>
</div>

<!-- Modal für Ordner erstellen -->
<div id="folder-modal" class="modal hidden">
    <div class="modal-content">
        <h3 id="folder-modal-title">Neuen Ordner erstellen</h3>
        <input type="text" id="new-folder-name" placeholder="Ordnername (z.B. Biologie)">
        <button class="primary-btn" onclick="createFolder()">Erstellen</button>
        <button class="primary-btn" style="background:#f1f2f6; color:#333;" onclick="toggleFolderModal(false)">Abbrechen</button>
    </div>
</div>

<!-- Modal für Karte erstellen -->
<div id="card-modal" class="modal hidden">
    <div class="modal-content">
        <h3>Neue Karteikarte</h3>
        <input type="text" id="new-card-term" placeholder="Begriff / Frage">
        <input type="text" id="new-card-def" placeholder="Definition / Antwort">
        <button class="primary-btn" onclick="createCard()">Hinzufügen</button>
        <button class="primary-btn" style="background:#f1f2f6; color:#333;" onclick="toggleCardModal(false)">Abbrechen</button>
    </div>
</div>

<script>
    // Datenstruktur
    let appData = JSON.parse(localStorage.getItem('karteiAppData')) || {
        folders: [
            { id: 1, name: "Biologie", color: "#3498db", cards: [ {term: "Mitose", def: "Kernteilung"} ] }
        ]
    };

    let currentView = { type: "home", folderIndex: null };
    let learningState = { cards: [], index: 0, showDef: false };

    function saveData() {
        localStorage.setItem('karteiAppData', JSON.stringify(appData));
        render();
    }

    function render() {
        const app = document.getElementById('app');
        
        if (currentView.type === "home") {
            let html = `
                <div class="header">
                    <div class="logo">🗂️ Kartei</div>
                    <div style="display:flex; gap:10px;">
                        <div class="icon-box" onclick="toggleBackup(true)">📥</div>
                        <div class="icon-box" onclick="toggleFolderModal(true)">➕</div>
                    </div>
                </div>
                <div class="banner">
                    <span>Willkommen in deiner Kartei-App! Erstelle Ordner und starte das Lernen.</span>
                </div>
            `;

            appData.folders.forEach((f, idx) => {
                let color = f.color || "#5c6bc0";
                let letter = f.name.charAt(0).toUpperCase();
                html += `
                    <div class="card-item" onclick="openFolder(${idx})" style="border-left-color: ${color}">
                        <div class="card-left">
                            <div class="badge-letter" style="background:${color}">${letter}</div>
                            <div class="card-info">
                                <h3>${f.name}</h3>
                                <p>${f.cards.length} Karten</p>
                            </div>
                        </div>
                        <button class="btn-icon" onclick="event.stopPropagation(); deleteFolder(${idx})">🗑️</button>
                    </div>
                `;
            });
            app.innerHTML = html;
        } 
        else if (currentView.type === "folder") {
            let f = appData.folders[currentView.folderIndex];
            let html = `
                <div class="header">
                    <div class="logo" onclick="goHome()" style="cursor:pointer;">🗂️ ${f.name}</div>
                    <div style="display:flex; gap:10px;">
                        <div class="icon-box" onclick="toggleCardModal(true)">➕</div>
                    </div>
                </div>
                <div style="margin-bottom: 20px; display:flex; gap:10px;">
                    <button class="primary-btn" style="margin:0;" onclick="startLearning(${currentView.folderIndex})">Prüfung starten</button>
                    <button class="primary-btn" style="margin:0; background:#f1f2f6; color:#333;" onclick="goHome()">← Zurück</button>
                </div>
                <h3>Karten in diesem Ordner</h3>
            `;

            if(f.cards.length === 0) {
                html += `<p style="color:#718093;">Noch keine Karten vorhanden.</p>`;
            }

            f.cards.forEach((c, cIdx) => {
                html += `
                    <div class="card-item" style="border-left-color: #5c6bc0; cursor:default;">
                        <div class="card-info">
                            <h3>${c.term}</h3>
                            <p>${c.def}</p>
                        </div>
                        <button class="btn-icon" onclick="deleteCard(${cIdx})">🗑️</button>
                    </div>
                `;
            });
            app.innerHTML = html;
        }
        else if (currentView.type === "learn") {
            let card = learningState.cards[learningState.index];
            if (!card) {
                app.innerHTML = `
                    <div style="text-align:center; padding: 40px;">
                        <h2>🎉 Durchgang beendet!</h2>
                        <button class="primary-btn" onclick="goHome()">Zurück zur Übersicht</button>
                    </div>
                `;
                return;
            }

            app.innerHTML = `
                <div class="header">
                    <div class="logo">Lernmodus (${learningState.index + 1}/${learningState.cards.length})</div>
                </div>
                <div class="learn-card" onclick="toggleCardSide()">
                    ${learningState.showDef ? card.def : card.term}
                </div>
                ${learningState.showDef ? `
                    <p style="text-align:center; color:#718093; margin-bottom:10px;">Wie gut wusstest du es?</p>
                    <div style="display:flex; gap:10px;">
                        <button class="primary-btn bg-red" onclick="rateCard('falsch')">❌ Falsch</button>
                        <button class="primary-btn bg-yellow" onclick="rateCard('mittel')">⚠️ Mittel</button>
                        <button class="primary-btn bg-green" onclick="rateCard('gut')">✅ Gut</button>
                    </div>
                ` : `<p style="text-align:center; color:#718093;">Klicke auf die Karte, um die Antwort zu sehen.</p>`}
                <button class="primary-btn" style="background:#f1f2f6; color:#333; margin-top:20px;" onclick="goHome()">Abbrechen</button>
            `;
        }
    }

    function openFolder(idx) { currentView = { type: "folder", folderIndex: idx }; render(); }
    function goHome() { currentView = { type: "home", folderIndex: null }; render(); }

    function toggleFolderModal(show) {
        document.getElementById('folder-modal').classList.toggle('hidden', !show);
    }

    function createFolder() {
        let name = document.getElementById('new-folder-name').value.trim();
        if(!name) return;
        const colors = ["#5c6bc0", "#2ed573", "#ffa502", "#ff4757", "#3498db"];
        let color = colors[appData.folders.length % colors.length];
        appData.folders.push({ id: Date.now(), name, color, cards: [] });
        document.getElementById('new-folder-name').value = '';
        toggleFolderModal(false);
        saveData();
    }

    function deleteFolder(idx) {
        if(confirm("Ordner wirklich löschen?")) {
            appData.folders.splice(idx, 1);
            saveData();
        }
    }

    function toggleCardModal(show) {
        document.getElementById('card-modal').classList.toggle('hidden', !show);
    }

    function createCard() {
        let term = document.getElementById('new-card-term').value.trim();
        let def = document.getElementById('new-card-def').value.trim();
        if(!term || !def) return;
        appData.folders[currentView.folderIndex].cards.push({ term, def });
        document.getElementById('new-card-term').value = '';
        document.getElementById('new-card-def').value = '';
        toggleCardModal(false);
        saveData();
    }

    function deleteCard(cIdx) {
        appData.folders[currentView.folderIndex].cards.splice(cIdx, 1);
        saveData();
    }

    function startLearning(fIdx) {
        let cards = appData.folders[fIdx].cards;
        if(cards.length === 0) {
            alert("Dieser Ordner enthält keine Karten!");
            return;
        }
        learningState = { cards: [...cards], index: 0, showDef: false };
        currentView = { type: "learn" };
        render();
    }

    function toggleCardSide() {
        learningState.showDef = !learningState.showDef;
        render();
    }

    function rateCard(rating) {
        learningState.showDef = false;
        learningState.index++;
        render();
    }

    function toggleBackup(show) {
        let modal = document.getElementById('backup-modal');
        modal.classList.toggle('hidden', !show);
        if(show) {
            document.getElementById('backup-text').value = JSON.stringify(appData);
        }
    }

    function copyBackup() {
        let text = document.getElementById('backup-text');
        text.select();
        navigator.clipboard.writeText(text.value);
        alert("Sicherungstext in die Zwischenablage kopiert!");
    }

    function restoreData() {
        try {
            let json = document.getElementById('restore-input').value;
            appData = JSON.parse(json);
            saveData();
            toggleBackup(false);
            alert("Daten erfolgreich wiederhergestellt!");
        } catch(e) {
            alert("Ungültiger Code!");
        }
    }

    render();
</script>

</body>
</html>
